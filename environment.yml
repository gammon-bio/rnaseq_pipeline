name: rnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fastp
  - fastqc
  # Pinned to 1.11.x to match the prebuilt mouse decoy index (salmon_index, indexVersion 6).
  # salmon 1.10.x cannot read a 1.11-built index (aborts with std::bad_alloc). See workflow/envs/salmon.yaml.
  - salmon=1.11
  - multiqc
